<title>Főoldal</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #f4f6f5;
    margin: 0;
    padding: 16px;
    color: #1f2d2b;
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    padding: 32px 20px;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 84px;
    text-align: center;
    text-decoration: none;
    background: #2c5f6f;
    color: #ffffff;
    border: none;
    padding: 22px 18px;
    border-radius: 18px;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    line-height: 1.25;
  }
  .btn:active { background: #23494f; }
  .btn + .btn { margin-top: 20px; }
</style>
</head>

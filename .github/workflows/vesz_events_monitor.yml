name: 🚨 VÉSZ Események Frissítése

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: vesz-events
  cancel-in-progress: false

jobs:
  frissit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: 📥 Kód letöltése
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: 🐍 Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Függőségek telepítése
        run: pip install requests beautifulsoup4

      - name: 🚨 VÉSZ események lekérdezése
        run: python fetch_vesz_events.py

      - name: 💾 Adat commitolása
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f data/vesz_events.json ]; then
            echo "Nincs adatfájl, nincs mit commitolni."
            exit 0
          fi

          cp data/vesz_events.json /tmp/vesz_events_sajat.json

          SIKERULT=0
          for i in 1 2 3 4 5 6; do
            echo "Push kísérlet $i/6..."
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp /tmp/vesz_events_sajat.json data/vesz_events.json
            git add data/vesz_events.json
            if git diff --staged --quiet; then
              echo "Nincs változás, kész."
              SIKERULT=1
              break
            fi
            git commit -m "vész események frissítve [skip ci]"
            if git push origin HEAD:main; then
              echo "Push sikeres."
              SIKERULT=1
              break
            else
              echo "Push ütközött, újrapróbálkozás..."
              sleep $((RANDOM % 6 + 2))
            fi
          done

          if [ "$SIKERULT" != "1" ]; then
            echo "⚠️ 6 próbálkozás után sem sikerült a push."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

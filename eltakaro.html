<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kép-eltakaró</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  /* A Balesetinfo program arculata: ugyanazok a színtokenek, világos és sötét módban. */
  :root {
    color-scheme: light;
    --bg: #f3f5f8; --card: #ffffff; --surface-2: #eef1f6; --border: #dde2ea;
    --text: #16202e; --muted: #5d6a7c; --blue: #1f5f8b; --blue-soft: #e2edf6; --blue-soft2: #d2e2ef; --blue-press: #174a6d;
    --red: #b3261e; --green: #1b7f4b; --disabled: #b9c3cf; --on-accent: #ffffff;
    --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --f-body: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root {
    color-scheme: dark;
    --bg: #0f141b; --card: #161d27; --surface-2: #1c2531; --border: #2a3443;
    --text: #e6ebf2; --muted: #93a0b2; --blue: #6fb0e0; --blue-soft: #1b2e40; --blue-soft2: #234059; --blue-press: #8cc3ea;
    --red: #f2867f; --green: #5cc98d; --disabled: #3a4656; --on-accent: #0f141b;
  } }

  * { box-sizing: border-box; }
  body { font-family: var(--f-body); background: var(--surface-2); margin: 0; padding: 16px; color: var(--text); }
  .card { max-width: 560px; margin: 0 auto; background: var(--card); border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); overflow: hidden; }
  .header { background: var(--blue); color: var(--on-accent); padding: 20px 20px 14px; }
  .header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  .form-blokk { padding: 20px; }
  .mezo-cimke { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 0 0 6px; }
  .mezo-cimke + .mezo-cimke { margin-top: 18px; }
  select, input[type="file"], input[type="password"] { width: 100%; padding: 12px 14px; font-size: 15px; border: 1.5px solid var(--border); border-radius: 12px; box-sizing: border-box; background: var(--card); }
  .btn { display: block; width: 100%; background: var(--blue); color: var(--on-accent); border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 14px; }
  .btn:active { background: var(--blue-press); }
  .btn:disabled { background: var(--disabled); cursor: not-allowed; }
  .btn-masodlagos { background: var(--blue-soft); color: var(--blue); }
  .btn-masodlagos:active { background: var(--blue-soft2); }
  .btn-sor { display: flex; gap: 10px; }
  .btn-sor .btn { margin-top: 0; }
  .belepo-hiba { color: var(--red); font-size: 13px; margin: -6px 0 14px; }
  .jelszo-doboz { position: relative; }
  .jelszo-doboz input { padding-right: 44px; }
  .jelszo-szem { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 19px; cursor: pointer; padding: 8px; line-height: 1; }
  .allapot { font-size: 13px; color: var(--muted); margin-top: 10px; min-height: 18px; }
  .allapot.hiba { color: var(--red); }
  .allapot.sikeres { color: var(--green); }
  .vaszon-doboz { position: relative; width: 100%; max-height: 62vh; border: 1.5px dashed var(--border); border-radius: 12px; margin-top: 14px; overflow: auto; -webkit-overflow-scrolling: touch; background: var(--surface-2); }
  canvas.elotag-vaszon { display: block; cursor: crosshair; touch-action: none; }
  canvas.elotag-vaszon.paszantazas-mod { cursor: grab; touch-action: pan-x pan-y pinch-zoom; }
  .zoom-sor { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .zoom-gomb { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--card); font-size: 18px; font-weight: 700; color: var(--blue); cursor: pointer; }
  .zoom-gomb:active { background: var(--blue-soft); }
  .zoom-ertek { flex: 0 0 auto; font-size: 13px; color: var(--muted); min-width: 44px; text-align: center; }
  .paszantazas-gomb { flex: 1 1 auto; height: 40px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--card); font-size: 13px; font-weight: 700; color: var(--blue); cursor: pointer; }
  .paszantazas-gomb.aktiv { background: var(--blue); color: var(--on-accent); border-color: var(--blue); }
  .pan-sorok { display: none; margin-top: 8px; }
  .pan-sorok.lathato { display: block; }
  .pan-sor { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .pan-sor label { flex: 0 0 60px; font-size: 12px; color: var(--muted); }
  .pan-sor input[type="range"] { flex: 1 1 auto; margin: 0; }
  .terulet-lista { margin-top: 10px; }
  .terulet-sor { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--surface-2); border-radius: 10px; font-size: 13px; margin-top: 6px; }
  .terulet-torles { color: var(--red); font-weight: 700; cursor: pointer; padding: 4px 8px; }
  .lepes-cim { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--blue); margin: 22px 0 8px; }
  .lepes-cim:first-child { margin-top: 0; }
  hr.elvalaszto { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  .sugo-szoveg { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .kep-blokk { margin-top: 4px; }
  .kep-cim { font-size: 14px; font-weight: 700; color: var(--text); margin: 0 0 4px; word-break: break-all; }

  /* Programhoz illő megjelenés */
  body { background: var(--bg); color: var(--text); font-family: var(--f-body); font-size: 15px; line-height: 1.5; padding: 20px 14px 40px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: none; }
  .header { background: none; color: var(--text); padding: 18px 20px 0; }
  .header h1 { font: 700 22px/1.2 var(--f-display); }
  .lepes-cim { font-family: var(--f-display); letter-spacing: .05em; }
  select, input, textarea, button { font-family: inherit; color: var(--text); }
  select, input[type="file"], input[type="password"], input[type="text"] { border-width: 1px; border-radius: 8px; }
  select:focus, input[type="password"]:focus, input[type="text"]:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
  input[type="file"]::file-selector-button { margin-right: 10px; padding: 8px 12px; border: 0; border-radius: 8px; background: var(--blue-soft); color: var(--blue); font: 700 14px var(--f-body); cursor: pointer; }
  input[type="range"] { accent-color: var(--blue); }
  .btn { border-radius: 10px; color: var(--on-accent); }
  .btn-masodlagos { color: var(--blue); }
  .btn:disabled { color: var(--muted); }
  /* A programon belül nyitva a program adja a keretet. */
  html.beagyazva body { padding: 4px 0 24px; }
  html.beagyazva .card { max-width: 640px; border: 0; background: none; }
  html.beagyazva .form-blokk { padding: 16px 14px; }
  html.beagyazva .header { padding: 4px 14px 0; }
</style>
</head>
<body>

  <!-- BELÉPŐ OLDAL -->
  <div class="card" id="belepoKartya">
    <div class="header"><h1>Kép-eltakaró</h1></div>
    <div class="form-blokk">
      <div class="jelszo-doboz">
        <input id="jelszoMezo" type="password" placeholder="Jelszó" autofocus>
        <button type="button" class="jelszo-szem" onclick="jelszoLathatosag()">👁</button>
      </div>
      <p class="belepo-hiba" id="belepoHiba" style="display:none;">Hibás jelszó, próbáld újra.</p>
      <button type="button" class="btn" onclick="belepesProbalkozas()">Belépés</button>
    </div>
  </div>

  <!-- FŐ ESZKÖZ (csak belépés után látszik) -->
  <div class="card" id="eszkozKartya" style="display:none;">
    <div class="header"><h1>Kép-eltakaró</h1></div>
    <div class="form-blokk">

      <label class="mezo-cimke" for="kepFajlok">Képek feltöltése (több is kiválasztható)</label>
      <input type="file" id="kepFajlok" accept="image/*" multiple>

      <div id="kepekTarolo"></div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script>
    // ============== BEÁLLÍTÁSOK ==============
    // Ide írd be a saját jelszavaidat (kliens-oldali ellenőrzés - ez egy
    // statikus HTML oldal, nincs mögötte szerver, ami "igazi" jelszó-
    // ellenőrzést tudna végezni; ez csak arra jó, hogy a véletlen
    // arra tévedőket kiszűrje, NEM egy erős biztonsági megoldás).
    const JELSZAVAK = ['baleset2026', 'megrendelo2026'];

    let belepettJelszo = null;

    function jelszoLathatosag() {
      const mezo = document.getElementById('jelszoMezo');
      mezo.type = (mezo.type === 'password') ? 'text' : 'password';
    }

    function belepesProbalkozas() {
      const beirt = document.getElementById('jelszoMezo').value;
      if (JELSZAVAK.indexOf(beirt) === -1) {
        document.getElementById('belepoHiba').style.display = 'block';
        return;
      }
      belepettJelszo = beirt;
      document.getElementById('belepoKartya').style.display = 'none';
      document.getElementById('eszkozKartya').style.display = 'block';
    }

    document.getElementById('jelszoMezo').addEventListener('keydown', function (esemeny) {
      if (esemeny.key === 'Enter') belepesProbalkozas();
    });

    // A Balesetinfo programból (ugyanarról a címről) nyitva nem kér újra jelszót.
    if (window.self !== window.top) document.documentElement.classList.add('beagyazva');
    try {
      const programJelszo = localStorage.getItem('balesetinfo_jelszo');
      if (programJelszo && JELSZAVAK.indexOf(programJelszo) !== -1) {
        document.getElementById('jelszoMezo').value = programJelszo;
        belepesProbalkozas();
      }
    } catch (e) { /* nincs tárhely */ }

    // ============== KÉP-ELTAKARÓ ESZKÖZ ==============
    const MODELL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js-models/tiny_face_detector';
    const ZOOM_MIN = 50;
    const ZOOM_MAX = 400;
    const ZOOM_LEPES = 25;

    let modellBetoltve = false;
    let modellBetoltesFolyamatban = null;
    const kepAllapotok = {};
    let kovetkezoId = 1;

    document.getElementById('kepFajlok').addEventListener('change', function (esemeny) {
      const fajlok = Array.from(esemeny.target.files);
      fajlok.forEach(function (fajl) {
        const id = 'k' + (kovetkezoId++);
        letrehozKepBlokkot(id, fajl.name);
        betoltKepet(id, fajl);
      });
    });

    function letrehozKepBlokkot(id, fajlNev) {
      const tarolo = document.getElementById('kepekTarolo');
      const blokk = document.createElement('div');
      blokk.className = 'kep-blokk';
      blokk.id = 'blokk-' + id;
      blokk.innerHTML =
        '<hr class="elvalaszto">' +
        '<p class="kep-cim">' + fajlNev.replace(/</g, '&lt;') + '</p>' +
        '<div class="vaszon-doboz" id="vaszonDoboz-' + id + '"><canvas class="elotag-vaszon" id="vaszon-' + id + '"></canvas></div>' +
        '<div class="zoom-sor">' +
        '<button type="button" class="zoom-gomb" onclick="zoomValtoztatas(\'' + id + '\', -' + ZOOM_LEPES + ')">－</button>' +
        '<span class="zoom-ertek" id="zoomErtek-' + id + '">100%</span>' +
        '<button type="button" class="zoom-gomb" onclick="zoomValtoztatas(\'' + id + '\', ' + ZOOM_LEPES + ')">＋</button>' +
        '<button type="button" class="paszantazas-gomb" id="paszantazasGomb-' + id + '" onclick="paszantazasValtas(\'' + id + '\')">✋ Pásztázás</button>' +
        '</div>' +
        '<div class="pan-sorok" id="panSorok-' + id + '">' +
        '<div class="pan-sor"><label>⇔ Balra-jobbra</label><input type="range" id="panXCsuszka-' + id + '" min="0" max="100" value="0" oninput="panXValtozott(\'' + id + '\')"></div>' +
        '<div class="pan-sor"><label>⇕ Fel-le</label><input type="range" id="panYCsuszka-' + id + '" min="0" max="100" value="0" oninput="panYValtozott(\'' + id + '\')"></div>' +
        '</div>' +
        '<p class="sugo-szoveg">Húzd az ujjad/egeret a képen, hogy kézzel is kijelölj egy takarandó területet (pl. logót). Nagyításnál kapcsold be a Pásztázást a görgetéshez, majd kapcsold ki a kijelöléshez.</p>' +
        '<p class="lepes-cim">Felismerés</p>' +
        '<button type="button" class="btn btn-masodlagos" id="felismerGomb-' + id + '" onclick="arcokFelismerese(\'' + id + '\')">Arcok felismerése</button>' +
        '<p class="allapot" id="allapotFelismeres-' + id + '"></p>' +
        '<div class="terulet-lista" id="teruletLista-' + id + '"></div>' +
        '<p class="lepes-cim">Eltakarás stílusa</p>' +
        '<select id="stilusValaszto-' + id + '">' +
        '<option value="pixel">Kipixelezés</option>' +
        '<option value="fekete">Fekete doboz</option>' +
        '<option value="blur">Elmosás</option>' +
        '</select>' +
        '<button type="button" class="btn" onclick="hatasAlkalmazasa(\'' + id + '\')">Hatás alkalmazása</button>' +
        '<p class="allapot" id="allapotHatas-' + id + '"></p>' +
        '<p class="lepes-cim">Végeredmény</p>' +
        '<button type="button" class="btn" onclick="letoltes(\'' + id + '\')">Letöltés</button>' +
        '<button type="button" class="btn btn-masodlagos" id="megosztasGomb-' + id + '" onclick="megosztas(\'' + id + '\')" style="display:none;">Megosztás</button>' +
        '<p class="allapot" id="allapotVeg-' + id + '"></p>';
      tarolo.appendChild(blokk);

      const canvasElem = document.getElementById('vaszon-' + id);
      kepAllapotok[id] = {
        canvas: canvasElem,
        ctx: canvasElem.getContext('2d'),
        teruletek: [],
        eredetiKep: null,
        rajzolasFolyamatban: false,
        rajzKezdoPont: null,
        zoom: 100,
        paszantazasMod: false,
      };

      bekotPointerEsemenyeket(id);
    }

    function betoltKepet(id, fajl) {
      const allapot = kepAllapotok[id];
      const kep = new Image();
      kep.onload = function () {
        allapot.eredetiKep = kep;
        allapot.canvas.width = kep.naturalWidth;
        allapot.canvas.height = kep.naturalHeight;
        allapot.ctx.drawImage(kep, 0, 0);
        frissitZoomMegjelenites(id);
      };
      kep.src = URL.createObjectURL(fajl);
    }

    // ============== ZOOM + PÁSZTÁZÁS ==============

    function frissitZoomMegjelenites(id) {
      const allapot = kepAllapotok[id];
      if (!allapot.eredetiKep) return;
      const doboz = document.getElementById('vaszonDoboz-' + id);

      // JAVÍTVA: korábban a 100% a kép NYERS pixelfelbontásához igazodott
      // (egy telefonos fotó simán 3000+ px széles), ezért mobilon a "100%"
      // valójában erősen felnagyítva jelent meg. Most a 100% a doboz
      // ténylegesen látható szélességéhez igazodik (ugyanaz, mint az
      // eredeti width:100% viselkedés), és a zoom EHHEZ képest nagyít.
      const alapSzelesseg = doboz.clientWidth;
      const megjelenitettSzelesseg = Math.round(alapSzelesseg * (allapot.zoom / 100));
      allapot.canvas.style.width = megjelenitettSzelesseg + 'px';
      allapot.canvas.style.height = 'auto';
      document.getElementById('zoomErtek-' + id).textContent = allapot.zoom + '%';

      const panSorok = document.getElementById('panSorok-' + id);
      panSorok.classList.toggle('lathato', allapot.zoom > 100);
      frissitPanCsuszkakat(id);
    }

    function zoomValtoztatas(id, delta) {
      const allapot = kepAllapotok[id];
      allapot.zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, allapot.zoom + delta));
      frissitZoomMegjelenites(id);
    }

    // A csúszkák 0-100 skálán mozgatják a dobozt: 0 = legbaloldalibb/
    // legfelső, 100 = legjobboldalibb/legalsó lehetséges görgetési pozíció.
    function panXValtozott(id) {
      const doboz = document.getElementById('vaszonDoboz-' + id);
      const csuszka = document.getElementById('panXCsuszka-' + id);
      const maxGorgetes = doboz.scrollWidth - doboz.clientWidth;
      doboz.scrollLeft = (Number(csuszka.value) / 100) * maxGorgetes;
    }

    function panYValtozott(id) {
      const doboz = document.getElementById('vaszonDoboz-' + id);
      const csuszka = document.getElementById('panYCsuszka-' + id);
      const maxGorgetes = doboz.scrollHeight - doboz.clientHeight;
      doboz.scrollTop = (Number(csuszka.value) / 100) * maxGorgetes;
    }

    // Ha a felhasználó kézzel/ujjal görget (pásztázás módban, vagy egérrel),
    // a csúszkák pozícióját is szinkronizáljuk, hogy ne mutassanak hamis
    // helyet.
    function frissitPanCsuszkakat(id) {
      const doboz = document.getElementById('vaszonDoboz-' + id);
      const maxX = doboz.scrollWidth - doboz.clientWidth;
      const maxY = doboz.scrollHeight - doboz.clientHeight;
      const xCsuszka = document.getElementById('panXCsuszka-' + id);
      const yCsuszka = document.getElementById('panYCsuszka-' + id);
      xCsuszka.value = maxX > 0 ? Math.round((doboz.scrollLeft / maxX) * 100) : 0;
      yCsuszka.value = maxY > 0 ? Math.round((doboz.scrollTop / maxY) * 100) : 0;
    }

    function paszantazasValtas(id) {
      const allapot = kepAllapotok[id];
      allapot.paszantazasMod = !allapot.paszantazasMod;
      const gomb = document.getElementById('paszantazasGomb-' + id);
      gomb.classList.toggle('aktiv', allapot.paszantazasMod);
      gomb.textContent = allapot.paszantazasMod ? '✏️ Kijelölés' : '✋ Pásztázás';
      allapot.canvas.classList.toggle('paszantazas-mod', allapot.paszantazasMod);
    }

    function vasznonBeluliPont(canvas, esemeny) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (esemeny.clientX - rect.left) * scaleX,
        y: (esemeny.clientY - rect.top) * scaleY,
      };
    }

    function bekotPointerEsemenyeket(id) {
      const allapot = kepAllapotok[id];
      const canvas = allapot.canvas;
      const doboz = document.getElementById('vaszonDoboz-' + id);

      doboz.addEventListener('scroll', function () {
        frissitPanCsuszkakat(id);
      });

      canvas.addEventListener('pointerdown', function (esemeny) {
        if (allapot.paszantazasMod) return; // pásztázás módban a böngésző natív görgetése fusson
        esemeny.preventDefault();
        allapot.rajzolasFolyamatban = true;
        allapot.rajzKezdoPont = vasznonBeluliPont(canvas, esemeny);
        canvas.setPointerCapture(esemeny.pointerId);
      });

      canvas.addEventListener('pointermove', function (esemeny) {
        if (!allapot.rajzolasFolyamatban) return;
        esemeny.preventDefault();
        const most = vasznonBeluliPont(canvas, esemeny);
        ujrarajzol(id);
        rajzolIdeiglenesKeretet(id, allapot.rajzKezdoPont, most);
      });

      canvas.addEventListener('pointerup', function (esemeny) {
        if (!allapot.rajzolasFolyamatban) return;
        allapot.rajzolasFolyamatban = false;
        const veg = vasznonBeluliPont(canvas, esemeny);
        const x = Math.min(allapot.rajzKezdoPont.x, veg.x);
        const y = Math.min(allapot.rajzKezdoPont.y, veg.y);
        const w = Math.abs(veg.x - allapot.rajzKezdoPont.x);
        const h = Math.abs(veg.y - allapot.rajzKezdoPont.y);
        if (w > 8 && h > 8) {
          allapot.teruletek.push({ x: x, y: y, w: w, h: h });
          frissitTeruletLista(id);
        }
        ujrarajzol(id);
      });
    }

    function rajzolIdeiglenesKeretet(id, kezdo, veg) {
      const allapot = kepAllapotok[id];
      const ctx = allapot.ctx;
      ctx.save();
      ctx.strokeStyle = '#2c5f6f';
      ctx.lineWidth = Math.max(2, allapot.canvas.width / 300);
      ctx.setLineDash([8, 6]);
      ctx.strokeRect(
        Math.min(kezdo.x, veg.x), Math.min(kezdo.y, veg.y),
        Math.abs(veg.x - kezdo.x), Math.abs(veg.y - kezdo.y)
      );
      ctx.restore();
    }

    function ujrarajzol(id) {
      const allapot = kepAllapotok[id];
      if (!allapot.eredetiKep) return;
      const ctx = allapot.ctx;
      const canvas = allapot.canvas;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(allapot.eredetiKep, 0, 0, canvas.width, canvas.height);
      allapot.teruletek.forEach(function (t) {
        ctx.save();
        ctx.strokeStyle = '#d99a2b';
        ctx.lineWidth = Math.max(2, canvas.width / 300);
        ctx.strokeRect(t.x, t.y, t.w, t.h);
        ctx.restore();
      });
    }

    function frissitTeruletLista(id) {
      const allapot = kepAllapotok[id];
      const lista = document.getElementById('teruletLista-' + id);
      lista.innerHTML = '';
      allapot.teruletek.forEach(function (t, idx) {
        const sor = document.createElement('div');
        sor.className = 'terulet-sor';
        sor.innerHTML = '<span>Terület ' + (idx + 1) + '</span><span class="terulet-torles" data-idx="' + idx + '">Törlés ✕</span>';
        lista.appendChild(sor);
      });
      lista.querySelectorAll('.terulet-torles').forEach(function (gomb) {
        gomb.addEventListener('click', function () {
          allapot.teruletek.splice(parseInt(gomb.getAttribute('data-idx'), 10), 1);
          frissitTeruletLista(id);
          ujrarajzol(id);
        });
      });
    }

    async function biztositsdAModellt() {
      if (modellBetoltve) return;
      if (!modellBetoltesFolyamatban) {
        modellBetoltesFolyamatban = faceapi.nets.tinyFaceDetector.loadFromUri(MODELL_URL).then(function () {
          modellBetoltve = true;
        });
      }
      await modellBetoltesFolyamatban;
    }

    async function arcokFelismerese(id) {
      const allapot = kepAllapotok[id];
      const allapotSzoveg = document.getElementById('allapotFelismeres-' + id);
      const gomb = document.getElementById('felismerGomb-' + id);
      gomb.disabled = true;
      allapotSzoveg.className = 'allapot';
      allapotSzoveg.textContent = 'Felismerő modell betöltése (első alkalommal eltarthat pár másodpercig)...';

      try {
        await biztositsdAModellt();
        allapotSzoveg.textContent = 'Arcok keresése...';
        const talalatok = await faceapi.detectAllFaces(allapot.canvas, new faceapi.TinyFaceDetectorOptions());

        talalatok.forEach(function (t) {
          allapot.teruletek.push({ x: t.box.x, y: t.box.y, w: t.box.width, h: t.box.height });
        });
        frissitTeruletLista(id);
        ujrarajzol(id);

        allapotSzoveg.className = 'allapot sikeres';
        allapotSzoveg.textContent = talalatok.length + ' arc felismerve.';
      } catch (hiba) {
        allapotSzoveg.className = 'allapot hiba';
        allapotSzoveg.textContent = 'Hiba a felismeréskor: ' + hiba;
      } finally {
        gomb.disabled = false;
      }
    }

    function hatasAlkalmazasa(id) {
      const allapot = kepAllapotok[id];
      const canvas = allapot.canvas;
      const ctx = allapot.ctx;
      const stilus = document.getElementById('stilusValaszto-' + id).value;
      const allapotSzoveg = document.getElementById('allapotHatas-' + id);

      if (allapot.teruletek.length === 0) {
        allapotSzoveg.className = 'allapot hiba';
        allapotSzoveg.textContent = 'Nincs kijelölt terület - jelölj ki legalább egyet (vagy ismerj fel arcokat).';
        return;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(allapot.eredetiKep, 0, 0, canvas.width, canvas.height);

      allapot.teruletek.forEach(function (t) {
        if (stilus === 'fekete') {
          ctx.fillStyle = '#111111';
          ctx.fillRect(t.x, t.y, t.w, t.h);
        } else if (stilus === 'pixel') {
          const blokkMeret = Math.max(4, Math.round(Math.min(t.w, t.h) / 12));
          const kicsiSz = Math.max(1, Math.floor(t.w / blokkMeret));
          const kicsiMa = Math.max(1, Math.floor(t.h / blokkMeret));
          const ideiglenes = document.createElement('canvas');
          ideiglenes.width = kicsiSz;
          ideiglenes.height = kicsiMa;
          const ideigCtx = ideiglenes.getContext('2d');
          ideigCtx.drawImage(canvas, t.x, t.y, t.w, t.h, 0, 0, kicsiSz, kicsiMa);
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(ideiglenes, 0, 0, kicsiSz, kicsiMa, t.x, t.y, t.w, t.h);
          ctx.imageSmoothingEnabled = true;
        } else if (stilus === 'blur') {
          const ideiglenes = document.createElement('canvas');
          ideiglenes.width = t.w;
          ideiglenes.height = t.h;
          const ideigCtx = ideiglenes.getContext('2d');
          ideigCtx.drawImage(canvas, t.x, t.y, t.w, t.h, 0, 0, t.w, t.h);
          ctx.save();
          ctx.filter = 'blur(' + Math.max(4, Math.round(Math.min(t.w, t.h) / 8)) + 'px)';
          ctx.drawImage(ideiglenes, t.x, t.y, t.w, t.h);
          ctx.restore();
        }
      });

      allapot.teruletek = [];
      frissitTeruletLista(id);
      allapot.eredetiKep = null;
      const ujKep = new Image();
      ujKep.onload = function () { allapot.eredetiKep = ujKep; };
      ujKep.src = canvas.toDataURL('image/png');

      allapotSzoveg.className = 'allapot sikeres';
      allapotSzoveg.textContent = 'Hatás alkalmazva. Ha kell, jelölj ki és takarj el további területeket, vagy töltsd le a végeredményt.';

      document.getElementById('megosztasGomb-' + id).style.display =
        (navigator.canShare && navigator.share) ? 'block' : 'none';
    }

    function letoltes(id) {
      const canvas = kepAllapotok[id].canvas;
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = 'eltakart_kep_' + id + '_' + Date.now() + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      document.getElementById('allapotVeg-' + id).className = 'allapot sikeres';
      document.getElementById('allapotVeg-' + id).textContent = 'Letöltve.';
    }

    async function megosztas(id) {
      const canvas = kepAllapotok[id].canvas;
      const allapotSzoveg = document.getElementById('allapotVeg-' + id);
      try {
        const valasz = await fetch(canvas.toDataURL('image/png'));
        const blob = await valasz.blob();
        const fajl = new File([blob], 'eltakart_kep.png', { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [fajl] })) {
          await navigator.share({ files: [fajl], title: 'Eltakart kép' });
        } else {
          allapotSzoveg.className = 'allapot hiba';
          allapotSzoveg.textContent = 'A megosztás ezen az eszközön/böngészőben nem támogatott - használd a letöltést.';
        }
      } catch (hiba) {
        if (hiba && hiba.name !== 'AbortError') {
          allapotSzoveg.className = 'allapot hiba';
          allapotSzoveg.textContent = 'Hiba megosztáskor: ' + hiba;
        }
      }
    }
  </script>
</body>

name: 📧 TV2 Riport Email Küldése

on:
  repository_dispatch:
    types: [tv2_report_trigger]

jobs:
  kuldes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: 📥 Kód letöltése
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: 🐍 Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📝 Payload kiírása fájlba
        run: |
          mkdir -p tv2_riport
          cat > tv2_riport/payload.json << 'PAYLOAD_EOF'
          ${{ toJson(github.event.client_payload) }}
          PAYLOAD_EOF

      - name: 📧 Email küldése
        env:
          EMAIL_KULDO:  ${{ secrets.EMAIL_KULDO }}
          EMAIL_JELSZO: ${{ secrets.EMAIL_JELSZO }}
        run: python tv2_riport/send_tv2_report.py

      - name: 💾 Előzmény commitolása
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f tv2_riport/data/sent_emails.json ]; then
            echo "Nincs előzményfájl, nincs mit commitolni."
            exit 0
          fi

          cp tv2_riport/data/sent_emails.json /tmp/sent_emails_sajat.json

          SIKERULT=0
          for i in 1 2 3 4 5 6; do
            echo "Push kísérlet $i/6..."
            git fetch origin main
            git reset --hard origin/main
            mkdir -p tv2_riport/data
            cp /tmp/sent_emails_sajat.json tv2_riport/data/sent_emails.json
            git add tv2_riport/data/sent_emails.json
            if git diff --staged --quiet; then
              echo "Nincs változás, kész."
              SIKERULT=1
              break
            fi
            git commit -m "email előzmény frissítve [skip ci]"
            if git push origin HEAD:main; then
              echo "Push sikeres."
              SIKERULT=1
              break
            else
              echo "Push ütközött, újrapróbálkozás..."
              sleep $((RANDOM % 6 + 2))
            fi
          done

          if [ "$SIKERULT" != "1" ]; then
            echo "⚠️ 6 próbálkozás után sem sikerült a push."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
